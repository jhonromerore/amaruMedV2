# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - amarumed-frontend-webapp

on:
  push:
    branches:
      - front
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://amarumedcontainer.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_2e5ec2dc1d1a44ff94854b59e988dd4f }}
        password: ${{ secrets.AzureAppService_ContainerPassword_9403940caa0445ba8f308bca484bac53 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: amarumedcontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_2e5ec2dc1d1a44ff94854b59e988dd4f }}/frontamarumed:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'amarumed-frontend-webapp'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_3d8ebd726feb41989df8621aa4f59af4 }}
        images: 'amarumedcontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_2e5ec2dc1d1a44ff94854b59e988dd4f }}/frontamarumed:${{ github.sha }}'